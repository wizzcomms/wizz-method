name: Quality & Validation

# Runs comprehensive quality checks on all PRs and pushes to main:
# - Prettier (formatting)
# - ESLint (linting)
# - markdownlint (markdown quality)
# - Installation component tests (compilation)
# - Routing eval, modo heurístico (evals/routing/run-routing-eval.mjs)
# Keep this workflow aligned with `npm run quality` in `package.json`.
# O modo --llm do eval de roteamento roda separado, em
# routing-eval-llm.yaml (manual/semanal, não é gate).

"on":
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        # Note: build-docs.mjs runs link validation internally before building
        run: npm run docs:build

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate method references
        run: npm run validate:method-refs

      - name: Routing eval (heuristic)
        # Modo heurístico e gratuito: só valida o gate isTrivial() do hook
        # wizz-router-enforce contra os casos "trivial" do dataset
        # (evals/routing/dataset.json). Não testa a classificação de rota
        # (agent:<area> vs maestro) dos 34 casos não-triviais, isso fica a
        # cargo do modo --llm, que roda separado (workflow
        # routing-eval-llm.yaml, manual/semanal, custa tokens). Este step
        # pega regressão do isTrivial de graça a cada PR.
        run: npm run eval:routing

version: 2

updates:
  # Runtime + dev dependencies declared in package.json (npm).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Dev-only tooling (lint/format/docs-build/test) is low blast-radius:
      # bundle it into one weekly PR instead of one PR per package.
      dev-dependencies:
        dependency-type: "development"

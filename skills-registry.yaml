# Wizz Method — Skills Registry (fonte única)
#
# Mapeia cada skill global a uma ÁREA (dona = agente wizz), cada SQUAD a um
# domínio consultivo, e dá um campo "when" curto pra desambiguar skills
# parecidas. Dois consumidores leem este arquivo:
#   1. O INSTALLER — decide quais skills copiar pra .claude/skills por área escolhida.
#   2. O MAESTRO/ROUTER — decide pra qual agente/skill/squad rotear.
# Mantê-los lendo o MESMO arquivo garante que roteamento e instalação nunca divirjam.
#
# Skills vivem em src/skills-lib/<id>/. Squads em src/squads/<id>/ (via wizz-party-mode).
#
# MCPs (Model Context Protocol servers) também são declarados aqui, por área, no
# campo `mcps:` (e `mcp_utility:` para os cross-cutting). Cada entrada tem:
#   id      — nome do server no config da IDE (chave em mcpServers)
#   when    — quando esse MCP ajuda (desambigua, igual ao `when` das skills)
#   server  — { command, args, env } gravado no .mcp.json pelo installer
# Secrets em `env` são SEMPRE placeholders `${VAR}` — o installer nunca escreve
# token real. O installer instala/recomenda os MCPs das áreas escolhidas; o
# maestro/router oferece o MCP certo em runtime. Mesma fonte única das skills.
#
# ─────────────────────────────────────────────────────────────────────────────
# ## Doutrina de Instalação (fonte única — installer E router honram)
# ─────────────────────────────────────────────────────────────────────────────
# Regras que governam COMO qualquer skill/dependência entra num projeto. Tanto o
# installer quanto o wizz-router aplicam estas regras ao propor ou executar install.
#
# 1. ESCOPO: sempre validar o escopo antes de instalar. PREFERIR local por projeto
#    (.claude/skills do projeto). NÃO instalar em cloud global geral por padrão.
#    Global do projeto apenas quando necessário. Nunca assumir global como padrão.
# 2. AUTO-DETECÇÃO DE DEPENDÊNCIAS (NPX/CLI/MCP): se a skill tem dependências,
#    detectar automaticamente e instalar junto no momento do install da skill,
#    cachear no projeto e reutilizar nas execuções futuras. Evitar re-instalação a
#    cada run. Uma skill deve vir "pronta para uso".
# 3. PERGUNTA TÉCNICA + SUGESTÃO OBRIGATÓRIA: havendo decisão de arquitetura (ex:
#    NPX no setup vs runtime), sugerir a melhor abordagem, explicar prós/contras em
#    1-2 linhas e recomendar o padrão ideal. NÃO só executar: orientar a decisão.
# 4. ESTRATÉGIA HÍBRIDA (padrão recomendado):
#    - Install-time (pré-instalação) RECOMENDADO para NPX, MCPs e dependências
#      críticas. Prós: melhor performance, menos bugs, menos dependência de runtime,
#      previsível. Contra: install inicial mais pesado.
#    - Runtime (lazy install) apenas para ferramentas opcionais e extensões raras.
#      Contra: pode quebrar execução, aumenta latência, pior para automação.
# 5. AUTO-UPDATE DE SKILLS: quando uma skill for enviada localmente, substituir a
#    versão anterior automaticamente, evitar duplicação, garantir consistência com
#    hooks e agentes, validar que a versão ativa é a mais recente.
# 6. INSTALAÇÃO GUIADA POR INTENÇÃO (UX simples): aceitar comandos simples
#    ("instalar skill de deploy", "instalar ferramenta de build"), interpretar a
#    intenção, traduzir para comandos reais (NPX/CLI/scripts) e executar. Fluxo
#    determinístico, sem interação manual complexa.
# 7. ESCOLHA INTELIGENTE DE FERRAMENTAS: havendo múltiplas opções, NÃO listar 20.
#    Escolher automaticamente a melhor pelo contexto e explicar a escolha em 1 linha.
# 8. OTIMIZAÇÃO INTELIGENTE (auto-sugestão): sugerir melhorias, otimizar
#    tokens/custo/execução, evitar redundância de instalações, reduzir complexidade.

version: 1

# ─────────────────────────────────────────────────────────────────────────────
# ÁREAS — cada uma tem um agente dono (executor) e as skills que ele puxa.
# ─────────────────────────────────────────────────────────────────────────────
areas:
  designer:
    agent: wizz-designer
    summary: "Design de produto e UI: interfaces, landing pages, design systems, motion, 3D."
    skills:
      - id: ui-ux-pro-max
        when: "Design system, paleta, tipografia, componente; pedido de UI amplo. Principal de busca de padrões/estilos."
      - id: impeccable
        when: "Gate de polish/qualidade de frontend: hardening de UI, acessibilidade, anti-padrões. Refina o que já existe."
      - id: huashu-design
        when: "Direção visual + protótipo HTML hi-fi, exploração de variantes, review 5-dim, export MP4/GIF."
      - id: premium-landing-ui-researcher
        when: "Projeto NOVO (greenfield): cria landing premium do zero, hero, 3D high-end. Estratégia source-first."
      - id: ui-component-curator
        when: "Projeto EXISTENTE: qual componente/efeito adicionar que combina com o estilo atual."
      - id: motion-3d-director
        when: "Direção de motion/animação, 3D, WebGL, scroll cinematográfico, image-to-video."
      - id: remotion-best-practices
        when: "Vídeo programático em React (Remotion) especificamente."
      - id: animate
        when: "Craft de animação/micro-interação: regras do Emil Kowalski (saída > entrada, só transform/opacity, respeitar reduced-motion). Complementa o motion-3d-director com a execução fina. Traz references + exemplos .tsx."
      - id: design-motion-principles
        when: "Auditor de movimento: revisa animação existente e aponta scale(0) no início, easing cru, reduced-motion faltando; pesa contenção/polimento/diversão pelo contexto."
      - id: canvas-design
        when: "Gerar PNG/PDF editável por código (carrossel, quote card, infográfico) com fonte/cor/logo sempre certos. Traz canvas-fonts."
      - id: algorithmic-art
        when: "Visual generativo por código (flow fields, ruído, partículas) para fundo/textura de hero, único a cada render, sem cara de banco de imagem."
      - id: taste-skill
        when: "Anti-slop em briefs NOVOS: lê o brief, define a direção e audita contra defaults de AI."
      - id: taste-redesign
        when: "Anti-slop em projeto EXISTENTE: audita o código atual, lista problemas, prioriza fixes."
      - id: react-components
        when: "Converter design (Stitch MCP) em componentes React/Vite."
      - id: decision-maker
        when: "Brief visual inicial: força 6 decisões de estética + 3 lógicas. Entra no kickoff, antes de construir."
    mcps:
      - id: magic
        when: "Gerar/refinar componentes prontos via 21st.dev (UI builder, inspiration, refiner)."
        server:
          command: npx
          # Pin de supply chain (2026-07-06): versão fixa; atualizar conscientemente.
          args: ["-y", "@21st-dev/magic@0.1.0"]
          env:
            API_KEY: "${MAGIC_API_KEY}"
    clis:
      - id: hyperframes
        when: "Renderizar vídeo a partir de HTML/CSS/animação (HTML→MP4, agent-native, 20+ skills). Alternativa HTML-nativa ao Remotion (que é React). Precisa ffmpeg + Node 22 + Chrome headless."
        check: "npx --yes hyperframes --version"
        install: "npx skills add heygen-com/hyperframes"
      - id: claude-video
        when: "Analisar/entender vídeo EXISTENTE: baixa, extrai frames e transcreve para resumir, achar momentos ou diagnosticar footage. NÃO cria vídeo. Precisa ffmpeg + yt-dlp (+ Groq/OpenAI p/ transcrição sem legenda)."
        check: "test -d $HOME/.claude/skills/watch"
        install: "npx skills add bradautomates/claude-video"
      - id: buttercut
        when: "EDITAR vídeo por IA: cortes, selects, cenas, roughcut via XML/FFmpeg. Sugerir quando o pedido for editar/cortar vídeo. Clone-and-run no PROJETO (não é skill add), pesado: Ruby + Python + FFmpeg + WhisperX. AVISOS: ~GB de modelos (WhisperX), build demorado, só Apple Silicon."
        platform: darwin-arm64
        check: "test -d ./buttercut"
        # Pin de supply chain (2026-07-06): checkout de SHA fixo; atualizar conscientemente.
        install: "git clone https://github.com/barefootford/buttercut.git buttercut && git -C buttercut checkout 1383f964ebc8b43c4af17f70b3ec6f611b18b3ce"
      - id: voicebox
        when: "Voz/TTS/clonagem de voz local para narração/VO de vídeo (7 engines TTS + Whisper STT). App desktop que expõe endpoint MCP local em runtime. Clone-and-run no projeto."
        check: "test -d ./voicebox"
        # Pin de supply chain (2026-07-06): checkout de SHA fixo; atualizar conscientemente.
        install: "git clone https://github.com/jamiepine/voicebox.git voicebox && git -C voicebox checkout f2cf2a729d733acd7c759d85c6ace2d602f50d6e"
    references:
      - "references/premium-agency-rules.md (regras $150k-tier, importadas por impeccable/huashu no modo high-end)"

  copy:
    agent: wizz-copy
    summary: "Copywriting: texto de venda, headlines, páginas, e-mails, sequências."
    skills:
      - id: copywriting
        when: "Escrever copy de venda/página/headline do zero ou reescrever."
      - id: copy-editing
        when: "Editar/melhorar copy existente (framework Seven Sweeps). Review editorial geral."
      - id: humanizer
        when: "Texto soa AI: remover padrões de escrita de máquina, dar naturalidade."
      - id: email-sequence
        when: "Sequências de e-mail (onboarding, nurture, lançamento)."
      - id: cold-email
        when: "Cold email / outbound B2B / prospecção."
      - id: sales-enablement
        when: "Material de vendas: deck, one-pager, objeções, demo script, playbook."

  seo:
    agent: wizz-seo
    summary: "SEO: auditoria, busca, AI search, schema, SEO programático."
    skills:
      - id: seo-audit
        when: "Ponto de partida: auditar/diagnosticar SEO, queda de tráfego, ranking, core web vitals."
      - id: ai-seo
        when: "Otimizar pra ser citado por LLMs/AI search (AEO/GEO/LLMO, AI Overviews)."
      - id: schema-markup
        when: "Implementar dados estruturados / structured data."
      - id: programmatic-seo
        when: "Gerar páginas em escala pra atacar muitas keywords."
      - id: site-architecture
        when: "Arquitetura de site / topic clusters / estrutura de URLs."
    clis:
      - id: distribb
        when: "EXECUTAR distribuição de SEO: publicar artigos + construir backlinks pela rede da Distribb, conectar Google Search Console, autopublicar notícias. Complementa (não duplica) as skills de SEO que só geram/auditam. Requer Distribb API + GSC (+ DataForSEO/Ahrefs no plano free)."
        check: "ls $HOME/.claude/skills 2>/dev/null | grep -qi distribb"
        install: "npx skills add Bomx/distribb-skill"

  growth:
    agent: wizz-growth
    summary: "Growth e conversão: marketing, CRO, lançamento, preço, retenção."
    skills:
      - id: marketing-ideas
        when: "Travou / quer inspiração ampla de marketing. Ponto de partida quando não sabe o canal."
      - id: marketing-psychology
        when: "Aplicar gatilhos/vieses/modelos mentais à persuasão."
      - id: product-marketing-context
        when: "Posicionamento de produto e contexto de marketing do produto."
      - id: launch-strategy
        when: "Lançar produto/feature: Product Hunt, GTM, waitlist, beta."
      - id: pricing-strategy
        when: "Preço, planos, freemium, packaging, willingness to pay."
      - id: paywall-upgrade-cro
        when: "Tela de upgrade in-app / paywall."
      - id: churn-prevention
        when: "Churn, retenção, cancelamento, NPS."
      - id: revops
        when: "Operações de receita: pipeline, métricas, processo de revenue."
      - id: page-cro
        when: "Otimizar conversão de página (home, landing, pricing, feature)."
      - id: form-cro
        when: "Otimizar formulários (fora de signup)."
      - id: popup-cro
        when: "Otimizar popups/modais."
      - id: onboarding-cro
        when: "Ativação pós-signup / onboarding de usuário."
      - id: signup-flow-cro
        when: "Fluxo de signup/registro."
      - id: competitor-alternatives
        when: "Página de comparação vs concorrente / alternatives / battle card."
      - id: referral-program
        when: "Programa de indicação/afiliados."
      - id: free-tool-strategy
        when: "Ferramenta grátis pra captação de leads."
      - id: ab-test-setup
        when: "Montar A/B test / experimento de conversão."
      - id: analytics-tracking
        when: "Setar/auditar tracking e medição (GA4, GTM, eventos, UTM, atribuição)."
    mcps:
      - id: scrapling
        when: "Scraping/crawl web para pesquisa de mercado, prospecção de leads e inteligência competitiva. Bypass anti-bot (Cloudflare), parsing adaptativo, spider concorrente. Requer: pip install 'scrapling[ai]' && scrapling install."
        server:
          command: scrapling
          args: ["mcp"]
        # The MCP server lives in the `[ai]` extra, and fetching needs browsers.
        # Without this the installer would write a config for a binary that
        # isn't installed → the client fails with ENOENT. `setup` makes the
        # installer install the package, download browsers, resolve `scrapling`
        # to an absolute path (server.command is rewritten), and verify it boots
        # before writing; if verify fails the server is skipped, not written.
        setup:
          bin: scrapling
          # Pin de supply chain (2026-07-06): versão fixa; atualizar conscientemente.
          install: 'uv tool install "scrapling[ai]==0.4.10" || pipx install "scrapling[ai]==0.4.10" || pip install --user "scrapling[ai]==0.4.10"'
          post_install: "{bin} install"
          verify: "{bin} --version"

  social:
    agent: wizz-social
    summary: "Social e roteiros virais: Reels/Shorts, hooks, calendário de conteúdo. Persona Rafa, aplica o Blueprint de Roteiro Viral e roteia para as CLIs de vídeo quando o roteiro vira vídeo."
    skills:
      - id: social-content
        when: "Criar/agendar conteúdo de social (LinkedIn, X, TikTok, IG...)."
      - id: content-strategy
        when: "Decidir O QUE produzir de conteúdo (topic clusters, calendário, pilares)."
      - id: copy-editing
        when: "Revisar/editar o texto do roteiro ou da legenda antes de publicar."
    # Roteiro viral em si (hook, corpo, CTA) é conhecimento do próprio agente
    # wizz-social (Blueprint de Roteiro Viral em knowledge/), não uma skill global.
    #
    # CLIs de vídeo: o roteiro é o começo do pipeline (roteiro → voz → render →
    # corte → publicação). As tools de vídeo VIVEM na área `designer` (fonte única,
    # não duplicar aqui). O wizz-social ROTEIA para elas pelo `when:`; a construção
    # pesada de vídeo é com o wizz-designer:
    #   voicebox     → narração/voz/TTS do roteiro
    #   hyperframes  → renderizar vídeo de HTML/CSS (HTML→MP4)
    #   buttercut    → editar/cortar o vídeo gravado (só darwin-arm64)
    #   claude-video → analisar um vídeo de referência (frames + transcrição)

  ads:
    agent: wizz-ads
    summary: "Mídia paga: campanhas Google/Meta/TikTok/LinkedIn, criativos, tracking."
    skills:
      - id: paid-ads
        when: "Estratégia de campanha, targeting, bidding, ROAS/CPA. Decidir/rodar ads."
      - id: ad-creative
        when: "Gerar/iterar criativos e headlines de anúncio em escala (RSA, variações)."
      - id: analytics-tracking
        when: "Tracking de conversão pros anúncios (compartilhada com growth)."
    mcps:
      - id: meta-ads
        when: "Gestão real de campanha Meta/Facebook/Instagram via API (criar/editar/medir ads)."
        server:
          command: npx
          # Pin de supply chain (2026-07-06): versão fixa; atualizar conscientemente.
          args: ["-y", "mcp-meta-ads@1.0.0"]
          env:
            META_ACCESS_TOKEN: "${META_ACCESS_TOKEN}"
    clis:
      - id: arcads
        when: "GERAR vídeo-ad e imagem por IA (Seedance/Sora/Veo/Kling/OmniHuman + Nano Banana) e publicar como Meta ad. Clone-and-run no projeto: git clone + ./scripts/setup.sh; precisa Python 3.10+ e ARCADS API key em .env (META_ACCESS_TOKEN opcional p/ publicar)."
        check: "test -d ./arcads-claude-code"
        # Pin de supply chain (2026-07-06): checkout de SHA fixo; atualizar conscientemente.
        install: "git clone https://github.com/krusemediallc/arcads-claude-code.git arcads-claude-code && git -C arcads-claude-code checkout 0b0d3610bbdcfcc2607c77a748d6abb341adda46"

  architect:
    agent: wizz-agent-architect
    summary: "Arquitetura, banco, segurança, infra, decisões técnicas."
    skills:
      - id: web-security
        when: "Auditar segurança web, OWASP, XSS/CSRF/injeção/SQLi, IDOR, headers, rate limit (IP+conta), CORS, clickjacking, vazamento de PII na resposta, antes de deploy/PR."
      - id: auth-and-secrets
        when: "Auth (JWT/OAuth/SSO/Clerk), token no header vs URL, revogar no logout, enumeração de usuário, gestão de secrets, rotação de credenciais."
      - id: desktop-security
        when: "Segurança desktop/Electron (contextIsolation, code signing)."
      - id: database-scaling
        when: "Banco lento, queries, índices, N+1, sharding, connection pool."
      - id: caching-and-queues
        when: "Cache (Redis), filas (BullMQ/SQS/Kafka), jobs assíncronos."
      - id: infrastructure
        when: "Escala de infra: Kubernetes, auto-scaling, CDN, SLOs, load test."
      - id: cloud-and-infra
        when: "Custo de cloud: right-sizing, spot/reserved, S3 lifecycle, billing AWS/GCP."
      - id: database-and-deps
        when: "Dependências/packages, vulnerabilidades, npm audit."
      - id: supabase-postgres-best-practices
        when: "Performance e boas práticas de Postgres/Supabase (queries, schema, RLS)."
      - id: ai-product-design
        when: "Construir/melhorar um agente ou produto de IA: escrever/revisar system prompt, definir persona/tom, guardrails e recusas, few-shot, chain-of-thought, orquestração multi-agente, handoff, detecção de frustração, generative UI, avaliar qualidade de saída. Base para desenhar os próprios agentes do método. 44 padrões (Owl-Listener, MIT)."
    mcps:
      - id: supabase
        when: "Operar Supabase de verdade: rodar SQL, migrations, inspecionar schema/RLS, logs."
        server:
          command: npx
          # Pin de supply chain (2026-07-06): versão fixa (era @latest); atualizar conscientemente.
          args: ["-y", "@supabase/mcp-server-supabase@0.8.2"]
          env:
            SUPABASE_ACCESS_TOKEN: "${SUPABASE_ACCESS_TOKEN}"

  qa:
    agent: wizz-qa
    summary: "QA: verificar o código de fora (testes, E2E, review adversarial)."
    skills:
      - id: adversarial-reviewer
        when: "Caçar bugs adversarialmente, stress-test de PR, 'tear this apart'. (Global; o engine usa wizz-review-adversarial-general por dentro.)"
      - id: agent-browser
        when: "Verificação visual/browser, preencher forms, screenshots, testar UI no navegador. CLI já instalado (não é MCP); browser SEMPRE via agent-browser, nunca Playwright."
    # qa NÃO declara mcps: verificação de browser é via agent-browser (CLI/skill),
    # não via MCP. Não usar o MCP do Playwright.
    clis:
      - id: agent-browser
        when: "Dirigir um browser real pra E2E/verificação: navegar, clicar, preencher form, screenshot, console. É CLI, não MCP."
        check: "agent-browser --version"
        # Pin de supply chain (2026-07-06): versão fixa; atualizar conscientemente.
        install: "npm install -g agent-browser@0.27.0"

  analyst:
    agent: wizz-agent-analyst
    summary: "Análise, pesquisa, brief, kickoff de projeto."
    skills:
      - id: inicio-de-projeto
        when: "Kickoff LEVE de engenharia: stack, personas, glossário, princípios, estrutura de pastas, checklist. Atalho sem cerimônia de PRD."
      - id: implementation-planner
        when: "Plano técnico de implementação de site/app premium pós-direção aprovada."
    mcps:
      - id: exa
        when: "Pesquisa web/prior-art durante planejamento (web search, descoberta de fontes)."
        server:
          command: npx
          # Pin de supply chain (2026-07-06): versão fixa; atualizar conscientemente.
          args: ["-y", "exa-mcp-server@3.2.1"]
          env:
            EXA_API_KEY: "${EXA_API_KEY}"

  memoria:
    agent: wizz-memoria
    summary: "Memória do projeto: o que foi decidido, salvar, ver estado."
    skills:
      - id: cerebro
        when: "Recuperar/salvar decisões, contexto, aprendizados; ver estado do projeto (/ver, /salvar, /decisao, /dump)."

# ─────────────────────────────────────────────────────────────────────────────
# UTILITÁRIOS — cross-cutting, não pertencem a uma área só.
# ─────────────────────────────────────────────────────────────────────────────
utility:
  - id: graphify
    when: "Transformar código/docs em knowledge graph; navegar estrutura antes de ler arquivos crus."
  - id: find-skills
    when: "Nenhuma skill cobre o pedido: buscar/instalar no marketplace (npx skills find)."
  - id: enhance-prompt
    when: "Empacotar um briefing mais completo/estruturado pra mandar a outro agente ou skill."
  - id: wizz-router
    when: "Roteador global/flat: descobre skills quando não se sabe a área; escala pro maestro se multi-área."

# ─────────────────────────────────────────────────────────────────────────────
# MCP_UTILITY — MCPs cross-cutting, oferecidos independente da área escolhida.
# ─────────────────────────────────────────────────────────────────────────────
mcp_utility:
  - id: context7
    when: "Docs atualizadas de qualquer lib/framework/SDK (React, Next, Prisma, Tailwind...). Útil em todo dev."
    server:
      command: npx
      # Pin de supply chain (2026-07-06): versão fixa; atualizar conscientemente.
      args: ["-y", "@upstash/context7-mcp@3.2.2"]

# ─────────────────────────────────────────────────────────────────────────────
# CLIs — ferramentas de linha de comando que os agentes chamam direto (não são
# MCP nem skill). O installer DETECTA se já estão instaladas (check) e, por
# padrão, só RECOMENDA o comando de install; instala de verdade apenas se o
# usuário marcar. `clis:` por área; `cli_utility:` para as cross-cutting.
# ─────────────────────────────────────────────────────────────────────────────
cli_utility:
  - id: rtk
    when: "Token economy: proxy que corta 60-90% de tokens em comandos de dev. O wizz-router assume RTK ativo (Passo 0). Útil em todo o ecossistema."
    check: "rtk --version"
    install: "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh"

# ─────────────────────────────────────────────────────────────────────────────
# SQUADS — painéis consultivos de personas (rodam via wizz-party-mode).
# Aconselham; depois o agente wizz da área executa. Domínio → quem chamar.
# ─────────────────────────────────────────────────────────────────────────────
squads:
  brand-squad:
    domain: "Branding, posicionamento, arquitetura de marca, naming, arquétipos."
    advises: [copy, designer]
    when: "Validar/definir posicionamento, identidade e estratégia de marca. Painel: Al Ries, Byron Sharp, Marty Neumeier, Kapferer, Keller..."
  copy-squad:
    domain: "Copywriting, mensagem, oferta, persuasão."
    advises: [copy]
    when: "Pressionar/afiar copy e mensagem antes do wizz-copy escrever."
  design-squad:
    domain: "Design visual e UX."
    advises: [designer]
    when: "Painel de design pra direção visual/UX antes do wizz-designer executar."
  c-level-squad:
    domain: "Estratégia de negócio, decisões executivas."
    advises: [analyst, pm, growth]
    when: "Decisão estratégica de alto nível, visão de negócio, board simulado."
  advisory-board:
    domain: "Consultoria geral multidisciplinar."

# Wizz Method — Skills Registry (fonte única)
#
# Mapeia cada skill global a uma ÁREA (dona = agente wizz), cada SQUAD a um
# domínio consultivo, e dá um campo "when" curto pra desambiguar skills
# parecidas. Dois consumidores leem este arquivo:
#   1. O INSTALLER — decide quais skills copiar pra .claude/skills por área escolhida.
#   2. O MAESTRO/ROUTER — decide pra qual agente/skill/squad rotear.
# Mantê-los lendo o MESMO arquivo garante que roteamento e instalação nunca divirjam.
#
# Skills vivem em src/skills-lib/<id>/. Squads em src/squads/<id>/ (via wizz-party-mode).
#
# MCPs (Model Context Protocol servers) também são declarados aqui, por área, no
# campo `mcps:` (e `mcp_utility:` para os cross-cutting). Cada entrada tem:
#   id      — nome do server no config da IDE (chave em mcpServers)
#   when    — quando esse MCP ajuda (desambigua, igual ao `when` das skills)
#   server  — { command, args, env } gravado no .mcp.json pelo installer
# Secrets em `env` são SEMPRE placeholders `${VAR}` — o installer nunca escreve
# token real. O installer instala/recomenda os MCPs das áreas escolhidas; o
# maestro/router oferece o MCP certo em runtime. Mesma fonte única das skills.
#
# ─────────────────────────────────────────────────────────────────────────────
# ## Doutrina de Instalação (fonte única — installer E router honram)
# ─────────────────────────────────────────────────────────────────────────────
# Regras que governam COMO qualquer skill/dependência entra num projeto. Tanto o
# installer quanto o wizz-router aplicam estas regras ao propor ou executar install.
#
# 1. ESCOPO: sempre validar o escopo antes de instalar. PREFERIR local por projeto
#    (.claude/skills do projeto). NÃO instalar em cloud global geral por padrão.
#    Global do projeto apenas quando necessário. Nunca assumir global como padrão.
#    EXCEÇÃO documentada: `wizz-router` (utility, id acima em `utility:`) é o
#    único caso onde global é o padrão operacionalmente correto — sua função é
#    ser o roteador flat que funciona mesmo FORA de um projeto Wizz (`when`:
#    "descobre skills quando não se sabe a área"). Ele é sincronizado junto do
#    hook global `wizz-router-enforce.js` via `npm run sync:global`
#    (tools/sync-global.mjs só resincroniza skills que já existem em
#    ~/.claude/skills — não instala novas; a instalação global inicial é
#    escolha explícita do usuário via `npx skills add`/installer com escopo
#    global). Todas as outras skills seguem a regra 1 normalmente (local).
# 2. AUTO-DETECÇÃO DE DEPENDÊNCIAS (NPX/CLI/MCP): se a skill tem dependências,
#    detectar automaticamente e instalar junto no momento do install da skill,
#    cachear no projeto e reutilizar nas execuções futuras. Evitar re-instalação a
#    cada run. Uma skill deve vir "pronta para uso".
# 3. PERGUNTA TÉCNICA + SUGESTÃO OBRIGATÓRIA: havendo decisão de arquitetura (ex:
#    NPX no setup vs runtime), sugerir a melhor abordagem, explicar prós/contras em
#    1-2 linhas e recomendar o padrão ideal. NÃO só executar: orientar a decisão.
# 4. ESTRATÉGIA HÍBRIDA (padrão recomendado):
#    - Install-time (pré-instalação) RECOMENDADO para NPX, MCPs e dependências
#      críticas. Prós: melhor performance, menos bugs, menos dependência de runtime,
#      previsível. Contra: install inicial mais pesado.
#    - Runtime (lazy install) apenas para ferramentas opcionais e extensões raras.
#      Contra: pode quebrar execução, aumenta latência, pior para automação.
# 5. AUTO-UPDATE DE SKILLS: quando uma skill for enviada localmente, substituir a
#    versão anterior automaticamente, evitar duplicação, garantir consistência com
#    hooks e agentes, validar que a versão ativa é a mais recente.
# 6. INSTALAÇÃO GUIADA POR INTENÇÃO (UX simples): aceitar comandos simples
#    ("instalar skill de deploy", "instalar ferramenta de build"), interpretar a
#    intenção, traduzir para comandos reais (NPX/CLI/scripts) e executar. Fluxo
#    determinístico, sem interação manual complexa.
# 7. ESCOLHA INTELIGENTE DE FERRAMENTAS: havendo múltiplas opções, NÃO listar 20.
#    Escolher automaticamente a melhor pelo contexto e explicar a escolha em 1 linha.
# 8. OTIMIZAÇÃO INTELIGENTE (auto-sugestão): sugerir melhorias, otimizar
#    tokens/custo/execução, evitar redundância de instalações, reduzir complexidade.

version: 1

# ─────────────────────────────────────────────────────────────────────────────
# ÁREAS — cada uma tem um agente dono (executor) e as skills que ele puxa.
# ─────────────────────────────────────────────────────────────────────────────
areas:
  designer:
    agent: wizz-designer
    summary: "Design de produto e UI: interfaces, landing pages, design systems, motion, 3D."
    # 3 PORTAS DE ENTRADA (2026-07, consolidação leve): o agente OFERECE/INVOCA
    # apenas as skills com `entry: true`. As demais são puxadas PELA porta da sua
    # camada (campo `door`) ou por pedido explícito do usuário — nunca oferecidas
    # soltas. Nada foi fundido: todos os arquivos e references continuam intactos.
    skills:
      # ── Porta 1: DIREÇÃO (decidir antes de construir) ──
      - id: decision-maker
        entry: true
        door: direcao
        when: "PORTA de direção: todo trabalho de decidir ANTES de construir. Brief visual inicial (6 decisões de estética + 3 lógicas) no kickoff. Puxa: taste-skill (direção anti-slop de brief novo) e motion-3d-director (decidir caminho motion/3D/vídeo)."
        rel:
          pairs_with: [taste-skill, motion-3d-director]
      - id: taste-skill
        door: direcao
        when: "Anti-slop em briefs NOVOS: lê o brief, define a direção e audita contra defaults de AI. Também cobre projeto EXISTENTE: audita o código atual, lista problemas, prioriza fixes (protocolo de redesign)."
      - id: motion-3d-director
        door: direcao
        when: "Direção de motion/animação, 3D, WebGL, scroll cinematográfico, image-to-video. Decide o caminho ANTES de implementar."

      # ── Porta 2: CONSTRUÇÃO E POLISH DE UI ──
      - id: ui-ux-pro-max
        entry: true
        door: construcao
        when: "PORTA de construção: criar/melhorar UI (design system, paleta, tipografia, componente, página). Puxa: premium-landing-ui-researcher (landing premium greenfield), ui-component-curator (1 componente em projeto existente), impeccable (gate de polish/acessibilidade), taste-skill (anti-slop em código existente, protocolo de redesign), huashu-design (protótipo HTML hi-fi/variantes/review) e react-components (Stitch→React)."
      - id: premium-landing-ui-researcher
        door: construcao
        when: "Projeto NOVO (greenfield): cria landing premium do zero, hero, 3D high-end. Estratégia source-first."
      - id: ui-component-curator
        door: construcao
        when: "Projeto EXISTENTE: qual componente/efeito adicionar que combina com o estilo atual."
      - id: impeccable
        door: construcao
        when: "Gate de polish/qualidade de frontend: hardening de UI, acessibilidade, anti-padrões. Refina o que já existe."
      - id: huashu-design
        door: construcao
        when: "Direção visual + protótipo HTML hi-fi, exploração de variantes, review 5-dim, export MP4/GIF."
      - id: react-components
        door: construcao
        when: "Converter design (Stitch MCP) em componentes React/Vite."

      # ── Porta 3: MOTION E ASSETS (executar animação e gerar mídia) ──
      - id: animate
        entry: true
        door: motion
        when: "PORTA de motion/assets: executar animação e gerar mídia. Craft de micro-interação (regras do Emil Kowalski: saída > entrada, só transform/opacity, reduced-motion). Puxa: design-motion-principles (auditar animação existente), remotion-best-practices (vídeo em React), canvas-design (PNG/PDF por código) e algorithmic-art (visual generativo)."
      - id: design-motion-principles
        door: motion
        when: "Auditor de movimento: revisa animação existente e aponta scale(0) no início, easing cru, reduced-motion faltando; pesa contenção/polimento/diversão pelo contexto."
      - id: remotion-best-practices
        door: motion
        when: "MONTAR o filme: vídeo em React (Remotion) com áudio, SFX, legenda e timing com precisão de frame. No pipeline de vídeo é o Remotion que faz a montagem final; o hyperframes só desenha as telas mudas (regra: HyperFrames desenha, Remotion monta — ver _shared/video-pipeline.md do módulo wizz)."
        rel:
          after: [hyperframes]
      - id: canvas-design
        door: motion
        when: "Gerar PNG/PDF editável por código (carrossel, quote card, infográfico) com fonte/cor/logo sempre certos. Traz canvas-fonts."
      - id: algorithmic-art
        door: motion
        when: "Visual generativo por código (flow fields, ruído, partículas) para fundo/textura de hero, único a cada render, sem cara de banco de imagem."
      - id: ctc-align
        door: motion
        when: "Timing por forced alignment: timestamps palavra a palavra de narração TTS para sincronizar legenda, corte de cena e animação com a fala. Fonte única de timing no pipeline de vídeo; substitui Whisper e estimativa manual."
    mcps:
      - id: magic
        when: "Gerar/refinar componentes prontos via 21st.dev (UI builder, inspiration, refiner)."
        server:
          command: npx
          # Pin de supply chain (2026-08-23): versão fixa; atualizar conscientemente.
          args: ["-y", "@21st-dev/magic@0.2.2"]
          env:
            API_KEY: "${MAGIC_API_KEY}"
    clis:
      - id: 21st-cli
        when: "Fonte PAGA complementar (catálogos gratuitos como React Bits/Cult UI/Componentry vêm primeiro; gate de aprovação do usuário). Buscar, inspecionar, instalar e publicar componentes no 21st.dev via terminal (search/get/add/publish, registry do time @wizzdigitalagency). Complementa o Magic MCP (geração assistida); é o caminho de catálogo/registry e o fallback declarado quando o MCP está offline. O install traz também as skills oficiais 21st-cli-use, 21st-registry e 21st-design-sync. Login interativo: `21st login` (em CI usar env API_KEY_21ST)."
        rel:
          pairs_with: [magic]
        check: "command -v 21st"
        install: "npm i -g @21st-dev/cli && npx @21st-dev/cli install-skill"
      - id: hyperframes
        when: "DESENHAR telas de vídeo em HTML/CSS (HTML→MP4, agent-native, 20+ skills): cena isolada e MUDA — maqueta de WhatsApp/ChatGPT, gráfico animado, título, loop. NÃO usar para montagem com áudio/SFX/legenda sincronizada (posicionador de áudio falhou em produção, ~2,76s de drift; CSS vaza entre telas): a montagem final é do Remotion (regra: HyperFrames desenha, Remotion monta — ver _shared/video-pipeline.md do módulo wizz). Precisa ffmpeg + Node 22 + Chrome headless."
        not_when: "Montagem com áudio/SFX/legenda sincronizada (posicionador de áudio falhou em produção, ~2,76s de drift; CSS vaza entre telas)."
        rel:
          before: [remotion-best-practices]
        platform: [darwin, linux]
        check: "test -d $HOME/.claude/skills/hyperframes"
        # Pin de supply chain (2026-08-23): clone temporário + checkout do SHA
        # + `skills add` do path local. Atualizar conscientemente.
        # Neutraliza remotion-to-hyperframes: o bundle instala uma skill de
        # migração Remotion→HyperFrames proibida pela regra do pipeline
        # (_shared/video-pipeline.md: HyperFrames desenha, Remotion monta).
        install: 'd="$(mktemp -d)" && git clone https://github.com/heygen-com/hyperframes.git "$d" && git -C "$d" checkout 59a69a145bfbd0f10dee72246b68ee5d9bd71063 && npx skills add "$d" -g -y --copy && rm -rf "$d" && rm -rf "$HOME/.claude/skills/remotion-to-hyperframes"'
      - id: claude-video
        when: "Analisar/entender vídeo EXISTENTE: baixa, extrai frames e transcreve para resumir, achar momentos ou diagnosticar footage. NÃO cria vídeo. Precisa ffmpeg + yt-dlp (+ Groq/OpenAI p/ transcrição sem legenda)."
        platform: [darwin, linux]
        check: "test -d $HOME/.claude/skills/watch"
        # Pin de supply chain (2026-08-23): clone temporário + checkout do SHA
        # + `skills add` local. Atualizar conscientemente.
        install: 'd="$(mktemp -d)" && git clone https://github.com/bradautomates/claude-video.git "$d" && git -C "$d" checkout 83da59fa78c3eee9e20f515fe75c438bb5166efd && npx skills add "$d" -g -y --copy && rm -rf "$d"'
      - id: buttercut
        when: "EDITAR vídeo por IA: cortes, selects, cenas, roughcut via XML/FFmpeg. Sugerir quando o pedido for editar/cortar vídeo. Clone-and-run no PROJETO (não é skill add), pesado: Ruby + Python + FFmpeg + WhisperX. AVISOS: ~GB de modelos (WhisperX), build demorado, só Apple Silicon."
        platform: darwin-arm64
        check: "test -d ./buttercut"
        # Pin de supply chain (2026-08-23): checkout de SHA fixo; atualizar conscientemente.
        install: "git clone https://github.com/barefootford/buttercut.git buttercut && git -C buttercut checkout f71d9537e2c22c3c4c1c659c4bdfb11e90ccd961"
        verify: "command -v ffmpeg >/dev/null 2>&1 && command -v ruby >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1"
      - id: voicebox
        when: "Voz/TTS/clonagem de voz local para narração/VO de vídeo (7 engines TTS + Whisper STT). App desktop que expõe endpoint MCP local em runtime. Clone-and-run no projeto."
        platform: [darwin, linux]
        check: "test -d ./voicebox"
        # Pin de supply chain (2026-08-23): checkout de SHA fixo; atualizar conscientemente.
        install: "git clone https://github.com/jamiepine/voicebox.git voicebox && git -C voicebox checkout 2bcb98d1a8b6fe05e15fbc1559e3085669e4035d"
      - id: ctc-align
        when: "Timestamps palavra a palavra CONFIÁVEIS de narração TTS (texto conhecido): sincronizar legenda, corte de cena, animação e elemento gráfico com a fala. Fonte única de timing em vídeo — substitui timestamps do Whisper e estimativa manual. Skill da lib: ctc-align (instalação + helper align.py + regras de âncora monotônica e duração mínima). Roda em CPU, sem CUDA."
        platform: [darwin, linux]
        check: "test -x ./tools/ctc-align/.venv/bin/ctc-forced-aligner"
        install: 'mkdir -p tools/ctc-align && uv venv --python 3.12 tools/ctc-align/.venv && uv pip install --python tools/ctc-align/.venv/bin/python "git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git"'
        verify: "command -v ffmpeg >/dev/null 2>&1 && command -v uv >/dev/null 2>&1"
      - id: fal-video
        when: "GERAR vídeo/imagem por IA (Veo/Kling/Wan e outros modelos via API da fal.ai), estilo UGC/ad-ready. Substitui o arcads: mesmo caso de uso (vídeo gerado por IA), custo 50-95% menor por vídeo, sem clone-and-run pesado. Precisa FAL_KEY em .env. Sem CLI binária oficial: usa o client Node oficial @fal-ai/client como dependência do projeto."
        platform: [darwin, linux]
        check: "test -f node_modules/@fal-ai/client/package.json"
        # Pin de supply chain (2026-08-25): versão fixa (client oficial fal.ai); atualizar conscientemente.
        install: "npm install @fal-ai/client@1.10.1"
    references:
      - "references/premium-agency-rules.md (regras $150k-tier, importadas por impeccable/huashu no modo high-end)"

  copy:
    agent: wizz-copy
    summary: "Copywriting: texto de venda, headlines, páginas, e-mails, sequências."
    skills:
      - id: copywriting
        when: "Escrever copy de venda/página/headline do zero ou reescrever."
      - id: copy-editing
        when: "Editar/melhorar copy existente (framework Seven Sweeps). Review editorial geral."
      - id: humanizer
        when: "Texto soa AI: remover padrões de escrita de máquina, dar naturalidade."
      - id: email-sequence
        when: "Sequências de e-mail (onboarding, nurture, lançamento)."
      - id: cold-email
        when: "Cold email / outbound B2B / prospecção."
      - id: sales-enablement
        when: "Material de vendas: deck, one-pager, objeções, demo script, playbook."

  seo:
    agent: wizz-seo
    summary: "SEO: auditoria, busca, AI search, schema, SEO programático."
    skills:
      - id: seo-audit
        when: "Ponto de partida: auditar/diagnosticar SEO, queda de tráfego, ranking, core web vitals."
      - id: ai-seo
        when: "Otimizar pra ser citado por LLMs/AI search (AEO/GEO/LLMO, AI Overviews)."
      - id: schema-markup
        when: "Implementar dados estruturados / structured data."
      - id: programmatic-seo
        when: "Gerar páginas em escala pra atacar muitas keywords."
      - id: site-architecture
        when: "Arquitetura de site / topic clusters / estrutura de URLs."
    clis:
      - id: distribb
        when: "EXECUTAR distribuição de SEO: publicar artigos + construir backlinks pela rede da Distribb, conectar Google Search Console, autopublicar notícias. Complementa (não duplica) as skills de SEO que só geram/auditam. Requer Distribb API + GSC (+ DataForSEO/Ahrefs no plano free)."
        platform: [darwin, linux]
        check: "ls $HOME/.claude/skills 2>/dev/null | grep -qi distribb"
        # Pin de supply chain (2026-08-23): clone temporário + checkout do SHA. Atualizar conscientemente.
        install: 'd="$(mktemp -d)" && git clone https://github.com/Bomx/distribb-skill.git "$d" && git -C "$d" checkout 061a055768e13cf09108932a90aeb2e957183858 && npx skills add "$d" -g -y --copy && rm -rf "$d"'

  growth:
    agent: wizz-growth
    summary: "Growth e conversão: marketing, CRO, lançamento, preço, retenção."
    skills:
      - id: marketing-ideas
        when: "Travou / quer inspiração ampla de marketing. Ponto de partida quando não sabe o canal."
      - id: marketing-psychology
        when: "Aplicar gatilhos/vieses/modelos mentais à persuasão."
      - id: product-marketing-context
        when: "Posicionamento de produto e contexto de marketing do produto."
      - id: launch-strategy
        when: "Lançar produto/feature: Product Hunt, GTM, waitlist, beta."
      - id: pricing-strategy
        when: "Preço, planos, freemium, packaging, willingness to pay."
      - id: paywall-upgrade-cro
        when: "Tela de upgrade in-app / paywall."
      - id: churn-prevention
        when: "Churn, retenção, cancelamento, NPS."
      - id: revops
        when: "Operações de receita: pipeline, métricas, processo de revenue."
      - id: page-cro
        when: "Otimizar conversão de página (home, landing, pricing, feature)."
      - id: form-cro
        when: "Otimizar formulários (fora de signup)."
      - id: popup-cro
        when: "Otimizar popups/modais."
      - id: onboarding-cro
        when: "Ativação pós-signup / onboarding de usuário."
      - id: signup-flow-cro
        when: "Fluxo de signup/registro."
      - id: competitor-alternatives
        when: "Página de comparação vs concorrente / alternatives / battle card."
      - id: referral-program
        when: "Programa de indicação/afiliados."
      - id: free-tool-strategy
        when: "Ferramenta grátis pra captação de leads."
      - id: ab-test-setup
        when: "Montar A/B test / experimento de conversão."
      - id: analytics-tracking
        when: "Setar/auditar tracking e medição (GA4, GTM, eventos, UTM, atribuição)."
      - id: site-launch-kit
        when: "Site pronto ou quase pronto pra ir ao ar: revisão de pré-lançamento em 15 rodadas corretivas (CTA acima da dobra, barra fixa mobile, tempo de resposta, prova social real, FAQ+FAQPage, imagens reais, endereço, titles, Open Graph, breadcrumbs, alt text, schema local, robots/sitemap, LGPD, medição), com regra anti-invenção e PENDÊNCIAS. Gatilhos: 'vamos subir o site', 'checklist de lançamento', 'revisa antes do deploy', pré-go-live, ou um item isolado (og:image, FAQ com schema, robots.txt). Roda DEPOIS do site construído, ANTES do deploy."
      - id: pesquisa-de-publico-do-piva
        when: "Pesquisa profunda de público, VoC, níveis de consciência, matriz de ângulos e léxico nativo de oferta compilados em HTML (metodologia @soupiva)."
      - id: wizz-offer-forge
        when: "Forjar oferta irresistível de resposta direta/infoproduto (mecanismo único, empilhamento de valor, garantia reversa, ponte de tráfego)."
    mcps:
      - id: scrapling
        when: "Scraping/crawl web para pesquisa de mercado, prospecção de leads e inteligência competitiva. Bypass anti-bot (Cloudflare), parsing adaptativo, spider concorrente. Requer: pip install 'scrapling[ai]' && scrapling install."
        server:
          command: scrapling
          args: ["mcp"]
        setup:
          bin: scrapling
          # Pin de supply chain (2026-08-23): versão fixa; atualizar conscientemente.
          install: 'uv tool install "scrapling[ai]==0.4.14" || pipx install "scrapling[ai]==0.4.14" || pip install --user "scrapling[ai]==0.4.14"'
          post_install: "{bin} install"
          verify: "{bin} --version"

  social:
    agent: wizz-social
    summary: "Social e roteiros virais: Reels/Shorts, hooks, calendário de conteúdo. Persona Rafa, aplica o Blueprint de Roteiro Viral e roteia para as CLIs de vídeo quando o roteiro vira vídeo."
    skills:
      - id: social-content
        when: "Criar/agendar conteúdo de social (LinkedIn, X, TikTok, IG...)."
      - id: content-strategy
        when: "Decidir O QUE produzir de conteúdo (topic clusters, calendário, pilares)."
      - id: copy-editing
        when: "Revisar/editar o texto do roteiro ou da legenda antes de publicar."

  ads:
    agent: wizz-ads
    summary: "Mídia paga: campanhas Google/Meta/TikTok/LinkedIn, criativos, tracking."
    skills:
      - id: paid-ads
        when: "Estratégia de campanha, targeting, bidding, ROAS/CPA. Decidir/rodar ads."
      - id: ad-creative
        when: "Gerar/iterar criativos e headlines de anúncio em escala (RSA, variações)."
      - id: analytics-tracking
        when: "Tracking de conversão pros anúncios (compartilhada com growth)."
    mcps:
      - id: meta-ads
        when: "Gestão real de campanha Meta/Facebook/Instagram via API (criar/editar/medir ads)."
        server:
          command: npx
          # Pin de supply chain (2026-08-23): versão fixa; atualizar conscientemente.
          args: ["-y", "mcp-meta-ads@1.0.0"]
          env:
            META_ACCESS_TOKEN: "${META_ACCESS_TOKEN}"

  architect:
    agent: wizz-agent-architect
    summary: "Arquitetura, banco, segurança, infra, decisões técnicas."
    skills:
      - id: web-security
        when: "Auditar segurança web, OWASP, XSS/CSRF/injeção/SQLi, IDOR, headers, rate limit (IP+conta), CORS, clickjacking, vazamento de PII na resposta, antes de deploy/PR."
      - id: auth-and-secrets
        when: "Auth (JWT/OAuth/SSO/Clerk), token no header vs URL, revogar no logout, enumeração de usuário, gestão de secrets, rotação de credenciais."
      - id: desktop-security
        when: "Segurança desktop/Electron (contextIsolation, code signing)."
      - id: database-scaling
        when: "Banco lento, queries, índices, N+1, sharding, connection pool."
      - id: caching-and-queues
        when: "Cache (Redis), filas (BullMQ/SQS/Kafka), jobs assíncronos."
      - id: infrastructure
        when: "Escala de infra: Kubernetes, auto-scaling, CDN, SLOs, load test."
      - id: cloud-and-infra
        when: "Custo de cloud: right-sizing, spot/reserved, S3 lifecycle, billing AWS/GCP."
      - id: database-and-deps
        when: "Dependências/packages, vulnerabilidades, npm audit."
      - id: supabase-postgres-best-practices
        when: "Performance e boas práticas de Postgres/Supabase (queries, schema, RLS)."
      - id: ai-product-design
        when: "Construir/melhorar um agente ou produto de IA: escrever/revisar system prompt, definir persona/tom, guardrails e recusas, few-shot, chain-of-thought, orquestração multi-agente, handoff, detecção de frustração, generative UI, avaliar qualidade de saída. Base para desenhar os próprios agentes do método. 44 padrões (Owl-Listener, MIT)."
    mcps:
      - id: supabase
        when: "Operar Supabase de verdade: rodar SQL, migrations, inspecionar schema/RLS, logs. Default é READ-ONLY e escopado a um projeto (--read-only --project-id); para ESCREVER (migrations, mutações), o agente precisa remover conscientemente o --read-only desta entrada antes de usar — nunca por padrão silencioso."
        server:
          command: npx
          # Pin de supply chain (2026-08-23): versão fixa; atualizar conscientemente.
          args: ["-y", "@supabase/mcp-server-supabase@0.11.0", "--read-only", "--project-id", "${SUPABASE_PROJECT_REF}"]
          env:
            SUPABASE_ACCESS_TOKEN: "${SUPABASE_ACCESS_TOKEN}"
    clis:
      - id: sentry-cli
        when: "CONDICIONAL — só ofereça se o projeto JÁ usa Sentry (existe SENTRY_DSN no env, sentry.properties, ou '@sentry/' no package.json) E o estágio é produção: subir release/sourcemaps, associar commits, monitorar erro em deploy. Nunca default e nunca sugerir ADOTAR Sentry só por causa desta CLI — é suporte a um Sentry que já existe, não uma recomendação de ferramenta."
        not_when:
          - "Projeto ainda não usa Sentry (sem SENTRY_DSN, sentry.properties ou '@sentry/' no package.json)."
          - "Fora de estágio de produção."
        check: "sentry-cli --version"
        # Pin de supply chain (2026-08-25): versão fixa; atualizar conscientemente.
        install: "npm install -g @sentry/cli@3.6.2"

  qa:
    agent: wizz-qa
    summary: "QA: verificar o código de fora (testes, E2E, review adversarial)."
    skills:
      - id: adversarial-reviewer
        when: "Passe único adversarial, ad hoc, fora de workflow — 'tear this apart' num trecho colado, sem contexto de projeto. Não confundir com wizz-review-adversarial-general (camada interna 'Blind Hunter' chamada só por wizz-code-review) nem com wizz-code-review (orquestrador bmm: 3 camadas paralelas + triagem, para review real de diff/PR)."
      - id: security-audit-pentest
        when: "Auditoria/pentest de segurança do app inteiro — 'auditar segurança', 'pentest', 'encontrar vulnerabilidades', varredura antes de release. Só para teste de segurança AUTORIZADO (seus sistemas ou de clientes com permissão): ferramenta dual-use, nunca usar contra alvo sem autorização."
      - id: launch-readiness
        when: "Auditoria de prontidão pra lançamento (Pre-launch Audit), multi-área: técnico/build, segurança, SEO/descoberta, analytics/medição, conteúdo/copy/prova social, legal/LGPD, infra/deploy/rollback. Gatilhos: 'tá pronto pra lançar?', 'auditoria de pré-lançamento', 'checklist de release amplo', 'o que falta antes de ir pra produção'. Gate por estágio: só roda de verdade em mvp/production, e recusa educadamente em estágio de descoberta/ideação. Diagnostica e prioriza por severidade (bloqueia/alto/médio/ok), nunca corrige cego: aponta security-audit-pentest pra aprofundar segurança com prova de exploração e site-launch-kit pra executar a correção quando a superfície do achado é site. Resultado persiste numa seção datada do project-context.md."
        not_when:
          - "Estágio de descoberta/ideação: projeto ainda sem superfície construída pra auditar (sem project-context.md, ou stage 'prototype' vazio)."
          - "Correção de um achado isolado de site já identificado: nesse caso vá direto pra site-launch-kit."
        rel:
          pairs_with: [site-launch-kit, security-audit-pentest]
      - id: agent-browser
        when: "Verificação visual/browser, preencher forms, screenshots, testar UI no navegador. CLI já instalado (não é MCP); browser SEMPRE via agent-browser, nunca Playwright."
    clis:
      - id: agent-browser
        when: "Dirigir um browser real pra E2E/verificação: navegar, clicar, preencher form, screenshot, console. É CLI, não MCP."
        check: "agent-browser --version"
        # Pin de supply chain (2026-08-23): versão fixa; atualizar conscientemente.
        install: "npm install -g agent-browser@0.34.0"
      - id: strix
        when: "CONDICIONAL, nunca default — executor de pentest AUTÔNOMO e OFENSIVO (agentes de IA que rodam o app, exploram e VALIDAM vulnerabilidades com PoC real). Complementa security-audit-pentest: aquela skill é a metodologia/checklist humana; o Strix é o executor automatizado. Ferramenta dual-use: SÓ contra alvo próprio ou com AUTORIZAÇÃO ESCRITA do dono do sistema e ESCOPO definido — nunca contra alvo de terceiros sem permissão. Roda SEMPRE dentro do sandbox Docker isolado que a própria ferramenta provê (jamais direto no host). Gate condicional: ofereça apenas mediante confirmação explícita do usuário, com escopo e autorização declarados; jamais acione por padrão silencioso. RETORNO DEFENSIVO OBRIGATÓRIO: o executor (subagente) SEMPRE devolve o achado em formato defensivo — falha, severidade, evidência mínima e correção — nunca payload/exploit cru ou arma pronta; assim o revisor recebe conteúdo defensivo pra corrigir, não instrução de ataque. Precisa de Docker rodando e de uma LLM API key configurada."
        not_when: "Sem alvo próprio ou sem autorização escrita e escopo definido do dono do sistema; nunca acionar por padrão silencioso."
        rel:
          pairs_with: [security-audit-pentest]
        platform: [darwin, linux]
        check: "command -v strix"
        # Pin de supply chain (2026-08-25): versão fixa do pacote pip; o sandbox
        # é a imagem pinada ghcr.io/usestrix/strix-sandbox:1.3.0, puxada no 1º run
        # dentro do Docker isolado. Atualizar conscientemente.
        install: "pipx install strix-agent==1.5.3"
        verify: "command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1"

  analyst:
    agent: wizz-agent-analyst
    summary: "Análise, pesquisa, brief, kickoff de projeto."
    skills:
      - id: inicio-de-projeto
        when: "Kickoff LEVE de engenharia: stack, personas, glossário, princípios, estrutura de pastas, checklist. Atalho sem cerimônia de PRD."
      - id: implementation-planner
        when: "Plano técnico de implementação de site/app premium pós-direção aprovada. Pesquisa web/prior-art durante o planejamento usa a tool nativa WebSearch (sem custo/MCP metered — o MCP exa foi removido em 2026-08-25)."

  memoria:
    agent: wizz-memoria
    summary: "Memória do projeto: o que foi decidido, salvar, ver estado."
    skills:
      - id: cerebro
        when: "Recuperar/salvar decisões, contexto, aprendizados; ver estado do projeto (/ver, /salvar, /decisao, /dump)."

# ─────────────────────────────────────────────────────────────────────────────
# UTILITÁRIOS — cross-cutting, não pertencem a uma área só.
# ─────────────────────────────────────────────────────────────────────────────
utility:
  - id: find-skills
    when: "Nenhuma skill cobre o pedido: buscar/instalar no marketplace (npx skills find)."
  - id: enhance-prompt
    when: "Empacotar um briefing mais completo/estruturado pra mandar a outro agente ou skill."
  - id: wizz-router
    when: "Roteador global/flat: descobre skills quando não se sabe a área; escala pro maestro se multi-área."

# ─────────────────────────────────────────────────────────────────────────────
# MCP_UTILITY — MCPs cross-cutting, oferecidos independente da área escolhida.
# ─────────────────────────────────────────────────────────────────────────────
mcp_utility:
  - id: context7
    when: "Docs atualizadas de qualquer lib/framework/SDK (React, Next, Prisma, Tailwind...). Útil em todo dev."
    server:
      command: npx
      # Pin de supply chain (2026-08-23): versão fixa; atualizar conscientemente.
      args: ["-y", "@upstash/context7-mcp@4.0.3"]

# ─────────────────────────────────────────────────────────────────────────────
# CLIs — ferramentas de linha de comando que os agentes chamam direto (não são
# MCP nem skill). O installer DETECTA se já estão instaladas (check) e, por
# padrão, só RECOMENDA o comando de install; instala de verdade apenas se o
# usuário marcar. `clis:` por área; `cli_utility:` para as cross-cutting.
#
# Campos opcionais por entrada (fase 2 da auditoria, M27/M14):
#   min_version — pin mínimo comparado via semver pelo installer (detectClis);
#                 abaixo do pin, a entrada some de `installed: true` e volta
#                 como upgrade oferecido (mensagem "atualizando X A → B"). A
#                 divisão de responsabilidade é deliberada: `check` só prova
#                 presença/versão (roda o comando e devolve texto com o
#                 número), a COMPARAÇÃO em si vive no installer (JS), não em
#                 shell embutido — mais fácil de testar e de ler.
#   verify       — probe pós-check/pós-install de dependência mínima (ex.:
#                 `command -v ffmpeg`), útil pras CLIs clone-and-run onde
#                 `check` só prova "o clone existe", não que o runtime real
#                 funciona. Falha em `verify` nunca aborta (filosofia CLI
#                 opt-in) — só rebaixa `installed` e avisa.
# ─────────────────────────────────────────────────────────────────────────────
cli_utility:
  - id: rtk
    when: "Token economy: proxy que corta 60-90% de tokens em comandos de dev. O wizz-router assume RTK ativo (Passo 0). Útil em todo o ecossistema."
    # recommended (2026-07-08): o wizz-router assume RTK ativo no Passo 0, então
    # o rtk vem PRÉ-MARCADO no multiselect de CLIs (initialValues) em vez de
    # desmarcado como os demais. Continua opt-in — o install roda `curl | sh`,
    # logo o usuário ainda vê a seleção e pode desmarcar. Só muda o default de
    # "vazio" pra "rtk marcado", nunca instala à revelia (--yes/non-TTY seguem
    # recommend-only). É a única CLI cross-cutting; as de área ficam opt-out.
    recommended: true
    # min_version formal (2026-07-07, M27) substitui o sort -V embutido no
    # shell que existia aqui antes: auditoria 2026-07-07 (C4/RT1) achou 0.30.1
    # instalado vs v0.43.0 pinado, invisível ao check anterior a ele (`rtk
    # --version` só testava que rodava). Agora `check` volta a ser só
    # presença/versão (roda e imprime o número); a COMPARAÇÃO semver contra
    # min_version é feita pelo installer (detectClis), não em shell.
    min_version: 0.45.0
    check: "rtk --version"
    # Pin de supply chain (2026-08-23): tag v0.45.0 (antes: v0.43.0)
    # Checksum do install.sh nesta tag (2026-08-23): sha256
    # d6eb73a772903e13ff34ee1be8a8b24e896ba9a978f20d2279a08b4083ea6f77
    # (install.sh idêntico ao v0.43.0 — mesmo checksum.)
    # (RT1: tag git pode ser movida à força; o checksum trava o conteúdo real
    # que será executado, não só o nome da tag. Verificado com `shasum -c`
    # antes do `sh`; se a tag mudar de conteúdo, o install aborta em vez de
    # rodar script desconhecido.)
    install: "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v0.45.0/install.sh -o /tmp/rtk-install-v0.45.0.sh && echo 'd6eb73a772903e13ff34ee1be8a8b24e896ba9a978f20d2279a08b4083ea6f77  /tmp/rtk-install-v0.45.0.sh' | shasum -a 256 -c - && sh /tmp/rtk-install-v0.45.0.sh"

# ─────────────────────────────────────────────────────────────────────────────
